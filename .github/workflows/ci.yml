# The gate every change passes before it can merge or deploy: the web app, the API server and the engine (n8n workflows).
# Branch protection on main should require: app, app-db, engine, images (see DEPLOY.md).
name: CI

on:
  pull_request:
  push:
    branches: [main, 'feature/**', 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    name: app (typecheck, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck (shared, server, web)
        run: npm run typecheck
      - name: Typecheck the Vercel middleware
        run: npx tsc --noEmit --strict --target es2022 --module esnext --moduleResolution bundler --lib es2022,dom --types node --skipLibCheck middleware.ts
      - name: Unit tests
        run: npm test
      - name: Build (web + server)
        run: npm run build
      - name: Request bodies the engine receives are current
        run: |
          npm run export:payloads
          git diff --exit-code -- ../n8n/seo-agent/harness || { echo "::error::app/shared payloads changed: run npm run export:payloads and commit the result"; exit 1; }

  app-db:
    name: app (real Postgres suites)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: seo
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: seo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U seo -d seo_test" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://seo:ci-only@localhost:5432/seo_test
      TEST_DATABASE_URL: postgres://seo:ci-only@localhost:5432/seo_test
      G4_DB_TEST: '1'
      CMS_DB_TEST: '1'
      CRAWLER_JOBS: 'false'
      LINK_BUILDER_JOBS: 'false'
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Crawler logs, CMS publishing and integrations against Postgres
        working-directory: app/server
        run: npx vitest run --no-file-parallelism test/crawlerDb.test.ts test/integrations.pg.test.ts test/cmsRoutes.test.ts

  engine:
    name: engine (build + lints + harness)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No n8n/.env in CI (it holds secrets and is never committed): the build bakes its defaults, deliberately (B-F5). The four
      # INVARIANTS lints, the secret scanner and every asserted patch run inside the build and fail it.
      - name: Build the workflows
        working-directory: n8n/seo-agent
        env:
          SEO_BUILD_ALLOW_DEFAULTS: '1'
        run: python3 build_v4.py
      - name: Harness (every Code node against its fixtures; must end 0 failed)
        working-directory: n8n/seo-agent/harness
        run: |
          CODE_DIR="$PWD/code_v4" OUT_DIR="$RUNNER_TEMP/harness-out" node scenarios_v5.js > "$RUNNER_TEMP/harness.log" 2>&1 || status=$?
          grep -E '^FAIL' "$RUNNER_TEMP/harness.log" | head -50 || true
          tail -1 "$RUNNER_TEMP/harness.log"
          echo "### Harness: $(tail -1 "$RUNNER_TEMP/harness.log")" >> "$GITHUB_STEP_SUMMARY"
          exit "${status:-0}"
      - name: Deploy manifest names only workflows that exist
        working-directory: n8n/seo-agent
        run: |
          python3 - <<'EOF'
          import json, os, sys
          m = json.load(open('deploy_manifest.json'))
          missing = [f for f in m['workflows'] if not os.path.exists(os.path.join('workflows', f))]
          ids = {w.get('id') for f in m['workflows'] if f not in missing for w in json.load(open(os.path.join('workflows', f)))}
          unknown = [i for i in m['publish'] + m['publish_when_imap'] if i not in ids]
          if missing or unknown: sys.exit(f'missing files {missing}, ids not in the imported files {unknown}')
          print(len(m['workflows']), 'workflows,', len(m['publish']), 'published')
          EOF

  images:
    name: images (build only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: API server image (app/Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: app
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Engine image (n8n/deploy/Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: n8n
          file: n8n/deploy/Dockerfile
          push: false
          cache-from: type=gha,scope=engine
          cache-to: type=gha,mode=max,scope=engine
